name: build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install streamlit anthropic edge-tts requests moviepy==1.0.3 Pillow==9.5.0 pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --name AIVideoMaker
          --collect-all streamlit --collect-all imageio_ffmpeg --collect-all edge_tts
          --copy-metadata streamlit --copy-metadata anthropic --copy-metadata edge-tts
          --add-data "app.py;." launcher.py
      - uses: actions/upload-artifact@v4
        with: { name: AIVideoMaker-Windows, path: dist/AIVideoMaker }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: AIVideoMaker-Android-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
